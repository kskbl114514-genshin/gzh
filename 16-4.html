<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汽车导购 · Tab切换</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", "微软雅黑", sans-serif;
            background: #fff;
            min-height: 100vh;
            padding: 0;
        }

        /* ============ 顶部导航 ============ */
        .gzh_tabs {
            display: flex;
            border-bottom: 1px solid #e8e8e8;
            background: #fff;
            padding: 0 24px;
        }
        .gzh_tab {
            padding: 16px 22px;
            font-size: 15px;
            color: #666;
            cursor: pointer;
            position: relative;
            transition: color .2s ease;
            user-select: none;
            white-space: nowrap;
        }
        .gzh_tab:hover { color: #333; }
        .gzh_tab.gzh_active {
            color: #1a1a1a;
            font-weight: 700;
        }
        .gzh_tab.gzh_active::after {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 16px; right: 16px;
            height: 3px;
            background: #1a1a1a;
            border-radius: 2px 2px 0 0;
        }

        /* ============ 内容区 ============ */
        .gzh_content {
            padding: 28px 32px 40px;
            max-width: 780px;
            margin: 0 auto;
        }
        .gzh_big_title {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.5;
            margin-bottom: 28px;
            letter-spacing: .3px;
        }

        /* ============ 文章列表 ============ */
        .gzh_list { list-style: none; }
        .gzh_item {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px dashed #eee;
            cursor: pointer;
            transition: background .15s, padding-left .15s;
        }
        .gzh_item:hover {
            background: #fafafa;
            padding-left: 8px;
        }
        .gzh_item:hover .gzh_title { color: #c00; }
        .gzh_dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #e43d33;
            flex-shrink: 0;
            margin-right: 14px;
            box-shadow: 0 0 0 3px rgba(228,61,51,.1);
        }
        .gzh_title {
            flex: 1;
            font-size: 15px;
            color: #333;
            font-weight: 500;
            line-height: 1.6;
            transition: color .15s;
        }
        .gzh_date {
            font-size: 13px;
            color: #aaa;
            margin-left: 12px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

<!-- 顶部导航 -->
<nav class="gzh_tabs">
    <div class="gzh_tab gzh_active" data-tab="guide">导购</div>
    <div class="gzh_tab" data-tab="t39">3-9万</div>
    <div class="gzh_tab" data-tab="t917">9-17万</div>
    <div class="gzh_tab" data-tab="t1742">17-42万</div>
    <div class="gzh_tab" data-tab="suv">SUV</div>
</nav>

<!-- 内容区 -->
<main class="gzh_content">

                { t: "全民摇号时代？六款低价占号必备车型推荐", d: "12/19" },
                { t: "最高降幅20万！奥迪Q5等年底特惠SUV盘点", d: "12/18" }
            ]
        }
    };

    function gzh_switch(tabKey) {
        var data = gzh_DATA[tabKey];
        if (!data) return;
        // 切换 active 样式
        document.querySelectorAll('.gzh_tab').forEach(function(el) {
            el.classList.toggle('gzh_active', el.dataset.tab === tabKey);
        });
        // 渲染大标题
        document.getElementById('gzh_big_title').textContent = data.title;
        // 渲染文章列表
        var list = document.getElementById('gzh_list');
        list.innerHTML = '';
        data.items.forEach(function(it) {
            var li = document.createElement('li');
            li.className = 'gzh_item';
            li.innerHTML =
                '<span class="gzh_dot"></span>' +
                '<span class="gzh_title">' + it.t + '</span>' +
                '<span class="gzh_date">' + it.d + '</span>';
            list.appendChild(li);
        });
    }

    // 绑定点击事件
    document.querySelectorAll('.gzh_tab').forEach(function(el) {
        el.addEventListener('click', function() {
            gzh_switch(el.dataset.tab);
        });
    });

    // 初始化第一个
    gzh_switch('guide');
</script>
</body>
</html>
