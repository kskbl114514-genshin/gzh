<!-- 姓名：郭兹寒，日期：2026-10-26，功能：逢7过——100个盒子中7的倍数或含数字7的显示空盒子，其余显示数字 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>逢7过</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 40px 20px 80px;
            color: #e0e0e0;
        }
        .gzh_container {
            max-width: 960px;
            margin: 0 auto;
        }
        .gzh_header {
            text-align: center;
            margin-bottom: 40px;
        }
        .gzh_header h1 {
            font-size: 32px;
            color: #00d9ff;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .gzh_header p {
            color: #8892b0;
            font-size: 15px;
        }
        .gzh_legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #8892b0;
        }
        .gzh_legend span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .gzh_dot {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            display: inline-block;
        }
        .gzh_dot_num {
            background: rgba(0, 217, 255, 0.12);
            border: 1px solid rgba(0, 217, 255, 0.4);
        }
        .gzh_dot_empty {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }
        .gzh_board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
        }
        .gzh_box {
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .gzh_box_num {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.35);
            color: #00d9ff;
        }
        .gzh_box_num:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.18);
        }
        .gzh_box_empty {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.18);
            color: transparent;
        }
        @media (max-width: 640px) {
            .gzh_board { gap: 6px; }
            .gzh_box { font-size: 14px; border-radius: 6px; }
        }
    </style>
</head>
<body>
    <div class="gzh_container">
        <header class="gzh_header">
            <h1>逢 7 过</h1>
            <p>1 ~ 100 中，7 的倍数或含有数字 7 的数显示为空盒子，其余显示数字。</p>
        </header>
        <div class="gzh_legend">
            <span><i class="gzh_dot gzh_dot_num"></i>显示数字</span>
            <span><i class="gzh_dot gzh_dot_empty"></i>空盒子（7 的倍数或含 7）</span>
        </div>
        <div class="gzh_board" id="gzh_board"></div>
    </div>
    <script>
        var gzh_board = document.getElementById('gzh_board');
        function gzh_isSeven(gzh_n) {
            return gzh_n % 7 === 0 || String(gzh_n).indexOf('7') !== -1;
        }
        for (var gzh_i = 1; gzh_i <= 100; gzh_i++) {
            var gzh_box = document.createElement('div');
            if (gzh_isSeven(gzh_i)) {
                gzh_box.className = 'gzh_box gzh_box_empty';
            } else {
                gzh_box.className = 'gzh_box gzh_box_num';
                gzh_box.textContent = gzh_i;
            }
            gzh_board.appendChild(gzh_box);
        }
    </script>
</body>
</html>
