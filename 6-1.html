<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex{
            /* 容器 */
            display: flex;
            /* 子元素在一行显示 */
            flex-wrap:wrap;
        }
        .flex li{
            /* float:left; */
            width: 49%;
            height: 100px;
            border: 1px solid #333;
            line-height: 100px;
            list-style: none;
            text-align: center;
            flex-grow:1;
            display: flex;
        }
        .flex li:nth-child(1){
            align-items: center;/* 垂直居中 */
            justify-content: center; /* 水平居中 */
        }
        .box{
            width: 50%;
            height: 50%;
            background: rgb(210, 108, 108);
        }
        .flex li:nth-child(1)  .box{
            background:#333;
        }
    </style>
</head>
<body>
    <h2>郭兹寒 flex</h2>
    <ul class="flex">
        <li>
            <div class="box"></div>
        </li>
        <li>1</li>
        <li>2</li>
        <li>3</li>
        <li>4</li>
    </ul>
    <h2>浮点之后</h2>
</body>
</html>
