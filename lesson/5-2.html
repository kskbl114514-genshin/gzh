<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型、框模型,box model</title>
    <style>
        body,h2,ul,p{
            padding: 0;
            margin: 0;
        }
        #a{
            width: 400px;
            height: 400px;
            border: 1px solid #039;
            padding: 50px 40px 30px 20px;/*上 右 下 左*/
            margin:40px auto;
        }
        #b{
            width: 400px;
            height: 400px;
            border: 1px dashed #039;
            margin:50px auto 40px;
            /*border-left: 1px dotted #039;*/
        }
        /* 扩展1；完成c和d，边框用dotted，宽度为3px */
        #c{
            width: 400px;
            height: 400px;
            border: 3px dotted #039;
            margin:50px auto 40px;
        }
        #d{
            width: 400px;
            height: 400px;
            border: 3px dotted #039;
            margin:50px auto 40px;
        }
        /* 扩展2：找人和网页，修改其中的3-5部分 */
    </style>
</head>
<body>
    <div id="a">427 郭兹寒</div>
    <div id="b">427 郭兹寒</div>
    <div id="c">427 郭兹寒</div>
    <div id="d">427 郭兹寒</div>
</body>
</html>
