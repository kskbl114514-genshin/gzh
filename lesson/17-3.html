<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品列表 · Fetch API</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            padding: 30px 20px 60px;
        }
        .gzh_wrap { max-width: 1080px; margin: 0 auto; }

        /* ============ 顶部 ============ */
        .gzh_top {
            text-align: center;
            margin-bottom: 28px;
        }
        .gzh_top h1 {
            font-size: 26px; color: #0f172a; font-weight: 700;
        }
        .gzh_top p {
            color: #64748b; font-size: 13px; margin-top: 6px;
        }
        .gzh_api_tag {
            display: inline-block;
            background: #fff; border: 1px solid #e2e8f0; color: #0ea5e9;
            font-size: 11.5px; padding: 3px 10px; border-radius: 12px; margin-top: 10px;
            font-family: Consolas, monospace;
        }

        /* ============ Grid 列表 ============ */
        .gzh_grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 16px;
        }
        .gzh_card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(15,23,42,.06);
            transition: transform .2s, box-shadow .2s;
            cursor: pointer;
            display: flex; flex-direction: column;
        }
        .gzh_card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(15,23,42,.12);
        }
        .gzh_img {
            width: 100%; aspect-ratio: 4 / 3;
            background: #f8fafc;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .gzh_img img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform .3s;
        }
        .gzh_card:hover .gzh_img img { transform: scale(1.05); }

        /* 折扣标签 */
        .gzh_discount {
            position: absolute; top: 10px; left: 10px;
            background: linear-gradient(135deg,#ef4444,#dc2626);
            color: #fff; font-size: 12px; font-weight: 600;
            padding: 3px 8px; border-radius: 4px;
        }

        /* 品类标签 */
        .gzh_cat {
            position: absolute; top: 10px; right: 10px;
            background: rgba(15,23,42,.7); color: #fff;
            font-size: 11px; padding: 3px 8px; border-radius: 4px;
            text-transform: uppercase; letter-spacing: .5px;
        }

        /* 信息区 */
        .gzh_info {
            padding: 14px 14px 16px;
            flex: 1; display: flex; flex-direction: column;
        }
        .gzh_title {
            font-size: 14px; color: #1e293b; font-weight: 600;
            line-height: 1.4; margin-bottom: 6px;
            /* 单行省略 */
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .gzh_brand { font-size: 12px; color: #94a3b8; margin-bottom: 8px; }
        .gzh_bottom {
            display: flex; align-items: baseline; justify-content: space-between;
            margin-top: auto;
        }
        .gzh_price_now {
            font-size: 20px; color: #ef4444; font-weight: 700;
        }
        .gzh_price_now::before { content: "$"; font-size: 13px; margin-right: 1px; }
        .gzh_price_old {
            font-size: 12px; color: #94a3b8; text-decoration: line-through; margin-left: 4px;
        }
        .gzh_stars {
            font-size: 12px; color: #f59e0b;
        }
        .gzh_stars span { color: #64748b; margin-left: 2px; }

        /* ============ Loading ============ */
        .gzh_grid.gzh_loading .gzh_card { animation: gzh_shimmer 1.5s infinite; }
        .gzh_skeleton .gzh_img { background: linear-gradient(90deg,#f1f5f9,#e2e8f0,#f1f5f9); background-size: 200% 100%; animation: gzh_shimmer 1.5s infinite; }
        .gzh_skeleton .gzh_title { height: 14px; background: #e2e8f0; border-radius: 4px; margin-bottom: 6px; }
        .gzh_skeleton .gzh_title + .gzh_title { width: 70%; }
        .gzh_skeleton .gzh_brand { height: 10px; background: #e2e8f0; border-radius: 3px; width: 45%; }
        .gzh_skeleton .gzh_bottom > div { height: 16px; background: #e2e8f0; border-radius: 3px; width: 40%; }
        @keyframes gzh_shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        /* ============ Error ============ */
        .gzh_error {
            text-align: center; padding: 60px 20px; color: #dc2626; font-size: 15px;
        }
        .gzh_error::before { content: "⚠️\A"; white-space: pre; font-size: 48px; display: block; margin-bottom: 10px; }

        /* ============ 计数 ============ */
        .gzh_meta {
            text-align: center; color: #64748b; font-size: 12px; margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="gzh_wrap">
    <div class="gzh_top">
        <h1>🛍️ DummyJSON 商品列表</h1>
        <p>点击卡片查看详情 · Fetch API 动态渲染</p>
        <div class="gzh_api_tag">GET https://dummyjson.com/products?limit=8</div>
    </div>

    <div class="gzh_grid gzh_loading" id="gzh_grid">
        <!-- 8 个骨架屏 -->
        <div class="gzh_card gzh_skeleton"><div class="gzh_img"></div><div class="gzh_info"><div class="gzh_title"></div><div class="gzh_title"></div><div class="gzh_brand"></div><div class="gzh_bottom"><div></div><div></div></div></div></div>
        <div class="gzh_card gzh_skeleton"><div class="gzh_img"></div><div class="gzh_info"><div class="gzh_title"></div><div class="gzh_title"></div><div class="gzh_brand"></div><div class="gzh_bottom"><div></div><div></div></div></div></div>
        <div class="gzh_card gzh_skeleton"><div class="gzh_img"></div><div class="gzh_info"><div class="gzh_title"></div><div class="gzh_title"></div><div class="gzh_brand"></div><div class="gzh_bottom"><div></div><div></div></div></div></div>
        <div class="gzh_card gzh_skeleton"><div class="gzh_img"></div><div class="gzh_info"><div class="gzh_title"></div><div class="gzh_title"></div><div class="gzh_brand"></div><div class="gzh_bottom"><div></div><div></div></div></div></div>
        <div class="gzh_card gzh_skeleton"><div class="gzh_img"></div><div class="gzh_info"><div class="gzh_title"></div><div class="gzh_title"></div><div class="gzh_brand"></div><div class="gzh_bottom"><div></div><div></div></div></div></div>
        <div class="gzh_card gzh_skeleton"><div class="gzh_img"></div><div class="gzh_info"><div class="gzh_title"></div><div class="gzh_title"></div><div class="gzh_brand"></div><div class="gzh_bottom"><div></div><div></div></div></div></div>
        <div class="gzh_card gzh_skeleton"><div class="gzh_img"></div><div class="gzh_info"><div class="gzh_title"></div><div class="gzh_title"></div><div class="gzh_brand"></div><div class="gzh_bottom"><div></div><div></div></div></div></div>
        <div class="gzh_card gzh_skeleton"><div class="gzh_img"></div><div class="gzh_info"><div class="gzh_title"></div><div class="gzh_title"></div><div class="gzh_brand"></div><div class="gzh_bottom"><div></div><div></div></div></div></div>
    </div>

    <div class="gzh_meta" id="gzh_meta"></div>
</div>

<script>
    var gzh_LIST_URL = 'https://dummyjson.com/products?limit=8';

    /* 计算原价 */
    function gzh_calcOldPrice(price, discount) {
        if (!discount) return null;
        return (price / (1 - discount / 100)).toFixed(2);
    }

    /* 渲染星级 */
    function gzh_stars(rating) {
        var full = Math.round(rating);
        var html = '';
        for (var i = 0; i < 5; i++) {
            html += i < full ? '★' : '☆';
        }
        return html + '<span>(' + rating + ')</span>';
    }

    function gzh_render(list) {
        var grid = document.getElementById('gzh_grid');
        grid.classList.remove('gzh_loading');
        grid.innerHTML = '';

        list.forEach(function(p) {
            var old = gzh_calcOldPrice(p.price, p.discountPercentage);
            var card = document.createElement('div');
            card.className = 'gzh_card';
            card.onclick = function() {
                window.location.href = '17-3-detail.html?id=' + p.id;
            };
            card.innerHTML =
                '<div class="gzh_img">' +
                    (p.discountPercentage ? '<div class="gzh_discount">-' + Math.round(p.discountPercentage) + '%</div>' : '') +
                    '<div class="gzh_cat">' + p.category + '</div>' +
                    '<img src="' + p.thumbnail + '" alt="' + p.title + '" loading="lazy" onerror="this.src=\'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22150%22><rect fill=%22%23e2e8f0%22 width=%22200%22 height=%22150%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%2394a3b8%22 font-size=%2214%22 text-anchor=%22middle%22>无图</text></svg>\'">' +
                '</div>' +
                '<div class="gzh_info">' +
                    '<div class="gzh_title">' + p.title + '</div>' +
                    '<div class="gzh_brand">' + (p.brand || '') + ' · SKU: ' + p.sku + '</div>' +
                    '<div class="gzh_bottom">' +
                        '<div>' +
                            '<span class="gzh_price_now">' + p.price.toFixed(2) + '</span>' +
                            (old ? '<span class="gzh_price_old">$' + old + '</span>' : '') +
                        '</div>' +
                        '<div class="gzh_stars">' + gzh_stars(p.rating) + '</div>' +
                    '</div>' +
                '</div>';
            grid.appendChild(card);
        });
    }

    function gzh_error(msg) {
        var grid = document.getElementById('gzh_grid');
        grid.classList.remove('gzh_loading');
        grid.innerHTML = '<div class="gzh_error">' + msg + '</div>';
    }

    fetch(gzh_LIST_URL)
        .then(function(res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
        })
        .then(function(data) {
            if (!data.products) throw new Error('接口返回格式异常');
            gzh_render(data.products);
            document.getElementById('gzh_meta').textContent =
                '共 ' + data.total + ' 件商品 · 当前显示 ' + data.products.length + ' 件（skip=' + data.skip + ', limit=' + data.limit + '）';
        })
        .catch(function(err) {
            gzh_error(err.message);
        });
</script>
</body>
</html>
