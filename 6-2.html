<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex布局练习</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #dfe0df;
        }

        .stage {
            width: 100%;
            height: 350px;
            display: flex;
            border-top: 2px solid #3b3b3b;
            border-bottom: 2px solid #3b3b3b;
            background: #e5e5e5;
        }

        .panel {
            position: relative;
            flex: 1;
            background: #efefef;
            border-right: 2px solid #3b3b3b;
        }

        .panel:last-child {
            border-right: none;
        }

        .block {
            position: absolute;
            background: #d0d0d0;
            border: 2px solid #3b3b3b;
        }

        .panel-1 .square {
            width: 150px;
            height: 150px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .panel-2 .top-box {
            width: 58%;
            height: 28%;
            left: 50%;
            top: 36%;
            transform: translate(-50%, -50%);
        }

        .panel-2 .bottom-box {
            width: 58%;
            height: 28%;
            left: 50%;
            top: 72%;
            transform: translate(-50%, -50%);
        }

        .panel-3 .grid {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 78%;
            height: 76%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .panel-3 .grid .mini {
            width: calc(50% - 8px);
            height: calc(50% - 8px);
            background: #d0d0d0;
            border: 2px solid #3b3b3b;
        }

        .panel-4 .top-box {
            width: 72%;
            height: 26%;
            left: 50%;
            top: 22%;
            transform: translateX(-50%);
        }

        .panel-4 .bottom-left,
        .panel-4 .bottom-right {
            width: 30%;
            height: 24%;
            bottom: 12%;
        }

        .panel-4 .bottom-left {
            left: 29%;
            transform: translateX(-50%);
        }

        .panel-4 .bottom-right {
            left: 71%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="panel panel-1">
            <div class="block square"></div>
        </div>

        <div class="panel panel-2">
            <div class="block top-box"></div>
            <div class="block bottom-box"></div>
        </div>

        <div class="panel panel-3">
            <div class="grid">
                <div class="mini"></div>
                <div class="mini"></div>
                <div class="mini"></div>
                <div class="mini"></div>
            </div>
        </div>

        <div class="panel panel-4">
            <div class="block top-box"></div>
            <div class="block bottom-left"></div>
            <div class="block bottom-right"></div>
        </div>
    </div>
</body>
</html>
